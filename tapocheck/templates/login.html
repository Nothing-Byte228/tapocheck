<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в Telegram IDE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        body {
            background: linear-gradient(-45deg, #1f2a38, #2c3e50, #1a252f, #243342);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            color: #fff;
            text-align: center;
        }

        h2 { font-size: 22px; margin-bottom: 8px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: #aaa; margin-bottom: 24px; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #24a1de; margin-bottom: 6px; font-weight: 500; }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: rgba(36, 161, 222, 0.5); background: rgba(255,255,255,0.08); }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #ccc;
            margin: 18px 0;
            cursor: pointer;
            user-select: none;
        }
        .remember-group input { width: 16px; height: 16px; cursor: pointer; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #24a1de;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(36,161,222,0.3);
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #1d82b5; }

        .toggle-link { margin-top: 20px; font-size: 13px; color: #aaa; }
        .toggle-link span { color: #24a1de; cursor: pointer; font-weight: 500; }
        .toggle-link span:hover { text-decoration: underline; }

        .error-msg {
            background: rgba(255, 92, 92, 0.15);
            border: 1px solid rgba(255, 92, 92, 0.3);
            color: #ff5c5c;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 id="form-title">Войти в аккаунт</h2>
    <p class="subtitle" id="form-subtitle">Введите свои данные для доступа к IDE чату</p>

    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('login_page') }}" method="POST">
        <input type="hidden" name="action" id="form-action" value="login">

        <div class="input-group">
            <label for="username">ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
            <input type="text" name="username" id="username" required autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">ПАРОЛЬ</label>
            <input type="password" name="password" id="password" required>
        </div>

        <label class="remember-group">
            <input type="checkbox" name="remember" checked>
            Запомнить меня
        </label>

        <button type="submit" class="btn-submit" id="btn-text">Войти</button>
    </form>

    <div class="toggle-link">
        <span id="toggle-instruction">Ещё нет аккаунта?</span>
        <span id="toggle-btn" onclick="toggleMode()">Зарегистрироваться</span>
    </div>
</div>

<script>
    function toggleMode() {
        const actionInput = document.getElementById('form-action');
        const title = document.getElementById('form-title');
        const subtitle = document.getElementById('form-subtitle');
        const btnText = document.getElementById('btn-text');
        const instruction = document.getElementById('toggle-instruction');
        const toggleBtn = document.getElementById('toggle-btn');

        if (actionInput.value === 'login') {
            actionInput.value = 'register';
            title.innerText = 'Регистрация';
            subtitle.innerText = 'Создайте защищенный профиль в системе';
            btnText.innerText = 'Создать аккаунт';
            instruction.innerText = 'Уже есть аккаунт?';
            toggleBtn.innerText = 'Войти';
        } else {
            actionInput.value = 'login';
            title.innerText = 'Войти в аккаунт';
            subtitle.innerText = 'Введите свои данные для доступа к IDE чату';
            btnText.innerText = 'Войти';
            instruction.innerText = 'Ещё нет аккаунта?';
            toggleBtn.innerText = 'Зарегистрироваться';
        }
    }
</script>

</body>
</html>
